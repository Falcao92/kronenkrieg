<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronenkrieg</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>⚔️ Kronenkrieg</h1>

    <div class="card">
        <h2>Runde <span id="round"></span></h2>
    </div>

    <div class="card">
        <h2>Ressourcen</h2>

        <p>🌲 Holz: <span id="wood"></span></p>
        <p>🪨 Stein: <span id="stone"></span></p>
        <p>⛓ Eisen: <span id="iron"></span></p>
    </div>

    <div class="card">
        <h2>Gebäude</h2>

        <p>🌲 Holzfäller: <span id="lumberjack"></span></p>
        <button onclick="upgradeBuilding('lumberjack')">
            Holzfäller (+50 Holz)
        </button>

        <hr>

        <p>🪨 Steinbruch: <span id="quarry"></span></p>
        <button onclick="upgradeBuilding('quarry')">
            Steinbruch (+40 Stein)
        </button>

        <hr>

        <p>⛓ Eisenmine: <span id="mine"></span></p>
        <button onclick="upgradeBuilding('mine')">
            Eisenmine (+30 Eisen)
        </button>

        <hr>

        <p>🏰 Kaserne: <span id="barracks"></span></p>
        <button onclick="upgradeBuilding('barracks')">
            Kaserne ausbauen
        </button>

    </div>

    <div class="card">
        <h2>Militär</h2>

        <p>🛡 Speerträger: <span id="spears"></span></p>

        <button onclick="recruitSpears()">
            5 Speerträger rekrutieren
        </button>
    </div>

    <div class="card">
        <button class="next-round" onclick="nextRound()">
            Nächste Runde
        </button>
    </div>

      <div class="card">
        <h2>Chronik</h2>
        <div id="log"></div>
    </div>

</div>

game.jsscript>

</body>
</html>

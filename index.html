<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronenkrieg</title>

<style>
body{
    background:#181f2a;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:#273246;
    padding:30px;
    border-radius:12px;
    width:350px;
}

input{
    width:100%;
    margin-bottom:10px;
    padding:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
}

#message{
    margin-top:15px;
}
</style>

</head>
<body>

<div class="card">

<h1>⚔️ Kronenkrieg</h1>

<p>
Das rundenbasierte Strategiespiel.
</p>

<input id="username" placeholder="Benutzername">

<input
 id="password"
 type="password"
 placeholder="Passwort">

<button onclick="register()">
Registrieren
</button>
    <button onclick="login()">
Login
</button>

<div id="message"></div>

</div>

<script>

async function register(){

    const username =
      document.getElementById("username").value;

    const password =
      document.getElementById("password").value;

    const response =
      await fetch(
        "https://kronenkrieg-api.falkojaeger92.workers.dev/register",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({
            username,
            password
          })
        }
      );

    const data =
      await response.json();

    document.getElementById("message")
    .innerText =
    JSON.stringify(data);
}
async function login(){

    const username =
      document.getElementById("username").value;

    const password =
      document.getElementById("password").value;

    const response = await fetch(
        "https://kronenkrieg-api.falkojaeger92.workers.dev/login",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                username,
                password
            })
        }
    );

    const data = await response.json();

    if(data.token){

        localStorage.setItem(
            "token",
            data.token
        );

        window.location.href =
            "dashboard.html";
    }else{

        document.getElementById(
            "message"
        ).innerText =
        data.error || "Login fehlgeschlagen";
    }
}

</script>

</body>
</html>

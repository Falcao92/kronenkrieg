<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<title>Karte</title>

<style>

body{
    background:#101722;
    color:white;
    font-family:Arial;
}

#map{

    display:grid;

    grid-template-columns:
    repeat(60,40px);

    gap:2px;

    padding:20px;
}

.tile{

    width:40px;
    height:40px;

    background:#243449;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:18px;
}

</style>
</head>

<body>

<h1>🗺 Weltkarte</h1>

<div id="map"></div>

<script>

loadMap();

async function loadMap(){

    const response =
      await fetch(
        "https://kronenkrieg-api.falkojaeger92.workers.dev/map"
      );

    const data =
      await response.json();

    let html = "";

    for(let y=0;y<60;y++){

        for(let x=0;x<60;x++){

            let icon = "🌲";

            data.barbarians.forEach(b=>{

                if(
                  b.x===x &&
                  b.y===y
                ){
                   html += `
<div
class="tile"
onclick="attack(${b.id})"
>
🏚
</div>
`;

return;
                }

            });

            data.villages.forEach(v=>{

                if(
                  v.x===x &&
                  v.y===y
                ){
                    icon="🏰";
                }

            });

            html += `
            <div class="tile">
              ${icon}
            </div>`;
        }
    }

    document.getElementById("map")
    .innerHTML =
    html;
}

    async function attack(id){

 const token =
   localStorage.getItem("token");

 const response =
   await fetch(
     "https://DEINE-API.workers.dev/attack",
     {
       method:"POST",

       headers:{
         "Content-Type":"application/json",
         "Authorization":token
       },

       body:JSON.stringify({

         targetId:id,

         spears:10,

         swords:0,

         archers:0
       })
     }
   );

 const data =
   await response.json();

 alert(
   `Ankunft Runde ${data.arrivalRound}`
 );
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kronenkrieg - Weltkarte</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#101722;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.header{

    height:60px;

    background:#1a2433;

    border-bottom:2px solid #d4af37;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;
}

.header h1{
    color:#d4af37;
}

.controls{

    display:flex;
    gap:10px;
}

.controls button{

    padding:8px 12px;

    border:none;

    border-radius:6px;

    background:#4f7f37;

    color:white;

    cursor:pointer;
}

.controls button:hover{
    background:#618f48;
}

.map-wrapper{

    width:100vw;

    height:calc(100vh - 60px);

    overflow:auto;

    cursor:grab;
}

.map-wrapper:active{
    cursor:grabbing;
}

#map{

    display:grid;

    grid-template-columns:repeat(60,48px);

    gap:1px;

    transform-origin:top left;

    padding:20px;
}

.tile{

    width:48px;
    height:48px;

    background:#2d405a;

    border:1px solid #1e2e45;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:20px;

    transition:.15s;
}

.tile:hover{

    transform:scale(1.15);

    z-index:999;

    position:relative;
}

.player{

    background:#29456a;
}

.barbarian{

    background:#5d3b22;
}

.grass{
    background:#3d5b39;
}

.water{

    background:#2b5ea9;

    animation:
      waterMove 4s infinite;
}

.mountain{
    background:#666666;
}

.forest{
    background:#355229;
}

@keyframes waterMove{

    0%{
        filter:brightness(100%);
    }

    50%{
        filter:brightness(120%);
    }

    100%{
        filter:brightness(100%);
    }
}

</style>

</head>

<body>

<div class="header">

    <h1>🗺 Weltkarte</h1>

    <div class="controls">

        <button onclick="zoomIn()">
            ➕ Zoom
        </button>

        <button onclick="zoomOut()">
            ➖ Zoom
        </button>

    </div>

</div>

<div class="map-wrapper">

    <div id="map"></div>

</div>

<script>

let zoom = 1;

loadMap();

async function loadMap(){

    const response =
      await fetch(
        "https://kronenkrieg-api.falkojaeger92.workers.dev/map"
      );

    const data =
      await response.json();

    let html = "";

    for(let y=0; y<60; y++){

        for(let x=0; x<60; x++){

            let tileClass = "grass";
            let icon = "";

            for(const b of data.barbarians){

                if(
                    Number(b.x) === x &&
                    Number(b.y) === y
                ){

                    tileClass =
                      "barbarian";

                    icon = "🏚";
                }
            }

            for(const v of data.villages){

                if(
                    Number(v.x) === x &&
                    Number(v.y) === y
                ){

                    tileClass =
                      "player";

                    icon = "🏰";
                }
            }

            html += `
                <div
                  class="tile ${tileClass}"
                  data-x="${x}"
                  data-y="${y}"
                >
                    ${icon}
                </div>
            `;
        }
    }

    document.getElementById("map")
      .innerHTML = html;
}

async function attack(id){

    const token =
      localStorage.getItem("token");

    const response =
      await fetch(
        "https://kronenkrieg-api.falkojaeger92.workers.dev/attack",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":token
            },

            body:JSON.stringify({

                targetId:id,

                spears:10,

                swords:0,

                archers:0
            })
        }
      );

    const data =
      await response.json();

    alert(
      `Ankunft Runde ${data.arrivalRound}`
    );
}

function zoomIn(){

    zoom += 0.1;

    document.getElementById("map")
      .style.transform =
      `scale(${zoom})`;
}

function zoomOut(){

    zoom -= 0.1;

    if(zoom < 0.5){

        zoom = 0.5;
    }

    document.getElementById("map")
      .style.transform =
      `scale(${zoom})`;
}

</script>

</body>
</html>
